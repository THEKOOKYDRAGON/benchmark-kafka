name: Blacksmith Reverse Engineering

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Install debugging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y strace binutils

      - name: Basic system information
        run: |
          whoami
          id
          hostname
          uname -a
          cat /etc/os-release

      - name: Blacksmith processes
        run: |
          echo "===== BLACKSMITH PROCESSES ====="
          ps -efww | grep -i blacksmith || true

      - name: Process tree
        run: |
          echo "===== PROCESS TREE ====="
          sudo pstree -ap

          echo
          echo "===== BLACKSMITH SUBTREE ====="
          sudo pstree -ap | grep -i blacksmith -A40 -B20 || true

      - name: Inspect every blacksmithd instance
        run: |
          PIDS=$(pgrep -x blacksmithd || true)

          if [ -z "$PIDS" ]; then
            echo "No blacksmithd processes found."
            exit 0
          fi

          for PID in $PIDS; do
            echo
            echo "=================================================="
            echo "PID: $PID"
            echo "=================================================="

            echo
            echo "CMDLINE"
            sudo tr '\0' ' ' < /proc/$PID/cmdline
            echo

            echo
            echo "STATUS"
            sudo cat /proc/$PID/status || true

            echo
            echo "LSOF"
            sudo lsof -p $PID || true

            echo
            echo "FD LINKS"
            sudo ls -lah /proc/$PID/fd || true
          done

      - name: Dump Blacksmith configuration files
        run: |
          echo "===== /tmp ====="
          sudo ls -lah /tmp || true

          echo
          echo "===== /var/run/blacksmithd ====="
          sudo ls -lah /var/run/blacksmithd || true

          for f in /tmp/*.yaml /var/run/blacksmithd/*.yaml; do
            [ -f "$f" ] || continue

            echo
            echo "=================================================="
            echo "$f"
            echo "=================================================="

            sudo cat "$f"
          done

      - name: Unix sockets
        run: |
          echo "===== SS UNIX ====="
          sudo ss -xap || true

          echo
          echo "===== LSOF UNIX ====="
          sudo lsof -U || true

      - name: Binary information
        run: |
          file /usr/local/bin/blacksmithd || true
          ls -lh /usr/local/bin/blacksmithd || true
          sha256sum /usr/local/bin/blacksmithd || true

      - name: Binary strings
        run: |
          strings /usr/local/bin/blacksmithd | \
          grep -Ei \
          'nginx|log|watch|tail|socket|inotify|journald|upload|ship|ingest|heartbeat|duration|watchdog|cpu.max|epoll|eventfd|metrics|grpc|http|https' \
          | sort -u || true

      - name: Trigger nginx logging
        run: |
          echo "===== BEFORE ====="
          sudo tail -20 /var/log/nginx/access.log || true

          curl -s http://127.0.0.1 >/dev/null || true

          sleep 2

          echo
          echo "===== AFTER ====="
          sudo tail -20 /var/log/nginx/access.log || true

      - name: Trace log daemon
        run: |
          PID=$(pgrep -af "blacksmithd.*log_config.yaml" | awk 'NR==1 {print $1}')

          if [ -z "$PID" ]; then
            echo "Log daemon not found."
            exit 0
          fi

          sudo timeout 10 \
            strace \
            -f \
            -e trace=openat,read,write,close,sendmsg,recvmsg \
            -p "$PID" || true

      - name: Full lsof
        run: |
          sudo lsof || true
