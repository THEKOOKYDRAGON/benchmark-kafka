name: Blacksmith Reverse Engineering

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Install debugging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y strace bpftool binutils

      - name: Basic system information
        run: |
          whoami
          id
          hostname
          uname -a
          cat /etc/os-release

      - name: Blacksmith processes
        run: |
          echo "===== BLACKSMITH PROCESSES ====="
          ps -efww | grep -i blacksmith || true

      - name: Process tree
        run: |
          echo "===== PROCESS TREE ====="
          sudo pstree -ap

          echo
          echo "===== BLACKSMITH SUBTREE ====="
          sudo pstree -ap | grep -i blacksmith -A40 -B20 || true

      - name: Inspect every blacksmithd instance
        run: |
          for PID in $(pgrep -x blacksmithd); do
            echo
            echo "=================================================="
            echo "PID: $PID"
            echo "=================================================="

            echo
            echo "CMDLINE"
            sudo cat /proc/$PID/cmdline | tr '\0' ' '
            echo

            echo
            echo "STATUS"
            sudo cat /proc/$PID/status

            echo
            echo "LSOF"
            sudo lsof -p $PID || true

            echo
            echo "FD LINKS"
            sudo ls -lah /proc/$PID/fd || true
          done

      - name: Dump configuration files
        run: |
          echo "===== /tmp ====="
          sudo ls -lah /tmp

          echo
          echo "===== /var/run/blacksmithd ====="
          sudo ls -lah /var/run/blacksmithd || true

          for f in \
            /tmp/*.yaml \
            /var/run/blacksmithd/*.yaml
          do
            if [ -f "$f" ]; then
              echo
              echo "=================================================="
              echo "$f"
              echo "=================================================="
              sudo cat "$f"
            fi
          done

      - name: Unix sockets
        run: |
          echo "===== SS UNIX ====="
          sudo ss -xap

          echo
          echo "===== LSOF UNIX ====="
          sudo lsof -U

      - name: Binary information
        run: |
          file /usr/local/bin/blacksmithd
          ls -lh /usr/local/bin/blacksmithd
          sha256sum /usr/local/bin/blacksmithd

      - name: Binary strings
        run: |
          strings /usr/local/bin/blacksmithd | \
          grep -Ei \
          'nginx|log|watch|tail|socket|inotify|journald|fluent|vector|promtail|loki|cloudwatch|upload|ship|ingest|heartbeat|duration|watchdog|cpu.max|epoll|eventfd|metrics|grpc|http|https' \
          | sort -u || true

      - name: Trigger nginx logging
        run: |
          echo "===== BEFORE ====="
          sudo tail -20 /var/log/nginx/access.log || true

          curl -s http://127.0.0.1 >/dev/null || true

          sleep 2

          echo
          echo "===== AFTER ====="
          sudo tail -20 /var/log/nginx/access.log || true

      - name: Trace log daemon
        run: |
          PID=$(pgrep -af "blacksmithd.*log_config.yaml" | awk '{print $1}')

          if [ -n "$PID" ]; then
            sudo timeout 10 \
              strace \
              -f \
              -e trace=openat,read,write,close,sendmsg,recvmsg \
              -p "$PID" || true
          fi

      - name: eBPF inspection
        run: |
          sudo bpftool prog show || true
          echo
          sudo bpftool map show || true
          echo
          sudo bpftool link show || true

      - name: Full lsof
        run: |
          sudo lsof
