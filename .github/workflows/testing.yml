name: Runner Inventory

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Basic system information
        run: |
          whoami
          id
          hostname
          uname -a
          cat /etc/os-release

      - name: Sudo privileges
        run: |
          echo "===== SUDO ====="
          sudo -l

      - name: Environment (sanitized)
        run: |
          env | sort | \
          sed -E 's/(TOKEN|SECRET|PASSWORD|KEY)=.*/\1=***REDACTED***/g'

      - name: Network listeners
        run: |
          echo "===== LISTENING PORTS ====="
          sudo ss -tulpn

      - name: Running services
        run: |
          echo "===== SYSTEMD SERVICES ====="
          systemctl list-units --type=service

      - name: Blacksmith processes
        run: |
          echo "===== BLACKSMITH PROCESSES ====="
          ps auxww | grep -i blacksmith || true

      - name: Blacksmith binaries
        run: |
          echo "===== BLACKSMITHD ====="
          ls -lah /usr/local/bin/blacksmithd || true
          file /usr/local/bin/blacksmithd || true

      - name: Inspect runner hooks and root filesystem
        run: |
          echo "===== ROOT DIRECTORY ====="
          sudo ls -lah /


          sudo cat /common_utils.sh

      - name: Docker inspection
        run: |
          echo "===== DOCKER ====="
          docker version || true
          docker info || true

      - name: Docker privilege test
        run: |
          echo "===== DOCKER GROUP TEST ====="
          docker run --rm alpine id || true

      - name: Tool cache inspection
        run: |
          echo "===== TOOL CACHE ====="
          du -sh /opt/hostedtoolcache/* 2>/dev/null | sort -h || true

      - name: Metadata endpoint check
        run: |
          echo "===== AWS IMDS ====="
          curl -v --connect-timeout 2 \
            http://169.254.169.254/latest/meta-data/ \
            || true

      - name: Local results proxy
        run: |
          echo "===== RESULTS PROXY ====="
          curl -v http://192.168.127.86:49193/ || true

      - name: Probe Blacksmith local services
        run: |
          for p in 1037 1038 1039 1040 1041 1043 1044 1045 1046 1047; do
            echo
            echo "===== PORT $p ====="

            curl -i --max-time 3 \
              http://127.0.0.1:$p \
              || true

            echo
          done

      - name: Metrics discovery
        run: |
          echo "===== METRICS ====="

          curl -s http://127.0.0.1:1047/metrics || true

      - name: Journal access test
        run: |
          echo "===== JOURNAL ====="
          sudo journalctl -n 100 || true

      - name: Host mappings
        run: |
          echo "===== HOSTS ====="
          cat /etc/hosts

      - name: VM identification
        run: |
          echo "===== VM ====="
          hostnamectl || true
          systemd-detect-virt || true
          lscpu | grep -i hypervisor || true

      - name: Route information
        run: |
          echo "===== ROUTES ====="
          ip route
          ip addr

      - name: Public IP verification
        run: |
          echo "===== EGRESS IP ====="
          curl -s https://ifconfig.me || true
